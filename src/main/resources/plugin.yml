name: DTEmpireAIChat
version: "1.1.1"
main: com.dtempire.aichat.DTEmpireAIChatPlugin
api-version: "1.21"
author: "dtempire"
description: "Autonomous AI Game Master, Adaptive Player Profiler, Daily Quests & Hypixel Watchdog Anti-Cheat"

commands:
  aichat:
    description: Start or continue a private AI chat session
    usage: /aichat <message>
    permission: dtempire.aichat
  aiexit:
    description: End your private AI chat session
    usage: /aiexit
    permission: dtempire.aichat
  aihelp:
    description: Show AI help and commands
    usage: /aihelp
    permission: dtempire.aichat
  aidaily:
    description: View or claim your tailored daily quest and bounty
    usage: /aidaily [claim]
    aliases: [daily, quest]
  aiadmin:
    description: AI Game Master administrative controls and events
    usage: /aiadmin <event|gift|broadcast|stats|carepackage|reload>
    permission: dtempire.admin
  watchdog:
    description: Hypixel-style Watchdog Anti-Cheat inspection, testing, and reports
    usage: /watchdog <report|test|inspect|ban|stats>
    aliases: [wd]
  dtstatus:
    description: Post server status to Discord now
    usage: /dtstatus
    permission: dtempire.tracking.status
  dttracking:
    description: Enable or disable automatic server tracking
    usage: /dttracking <on|off>
    permission: dtempire.tracking.toggle
  dtempireai:
    description: Reload config and restart tracking
    usage: /dtempireai <restart|reload|status>
    permission: dtempire.tracking.admin

permissions:
  dtempire.aichat:
    default: true
  dtempire.daily:
    default: true
  dtempire.watchdog.report:
    default: true
  dtempire.watchdog.staff:
    default: op
  dtempire.admin:
    default: op
