# DTEmpireAIChat & Autonomous AI Game Master Configuration
# API endpoint for the AI service (your OmniRoute /chat/completions endpoint)
api:
  # Base URL for the AI API (e.g., http://127.0.0.1:25607 or https://route.ankitgupta.com.np/v1)
  base-url: "https://route.ankitgupta.com.np/v1"
  # Model name (must match your router's model name, e.g., DiscordBot)
  model: "DiscordBot"
  # API key for authentication (Bearer token)
  api-key: "sk-148e8148fd72f567-cxb970-bb8134ab"
  # Timeout in milliseconds
  timeout-ms: 30000
  # System prompt prefix for AI responses
  system-prompt: "You are a helpful AI assistant in a Minecraft server. Keep responses concise (under 256 chars for chat)."

# Chat session settings
session:
  # How long (seconds) a session stays active after last message
  inactivity-timeout: 300
  # Max messages to keep in conversation history per session
  max-history: 20

# Message formatting
messages:
  # Prefix for AI messages
  ai-prefix: "&8[&bAI&8] &r"
  # Color for player messages in private view
  player-prefix: "&8[&aYou&8] &r"
  # Help messages
  usage-aichat: "&8[&bAI&8] &rUsage: &e/aichat &7<message> &8- Start/continue a private AI chat"
  usage-aiexit: "&8[&bAI&8] &rUsage: &e/aiexit &8- End your private AI chat session"
  session-started: "&8[&bAI&8] &aStarted private AI chat session. Type &e/aichat <message> &ato talk, &e/aiexit &ato end."
  session-ended: "&8[&bAI&8] &cEnded your AI chat session."
  session-already-active: "&8[&bAI&8] &eYou already have an active AI chat session. Use &e/aiexit &eto end it first."
  no-active-session: "&8[&bAI&8] &cNo active AI chat session. Use &e/aichat <message> &cto start one."
  ai-error: "&8[&bAI&8] &cError contacting AI service. Please try again."
  api-not-configured: "&8[&bAI&8] &cAI API not configured. Ask an admin to set the API key."

# AI content filter
ai-filter:
  # Only answer Minecraft-related questions; refuse off-topic politely
  minecraft-only: true
  # Refusal message when the question is not Minecraft-related
  refusal: "&cI can only help with Minecraft and DTEmpire server topics."

# AI Game Master & Dynamic Events
gamemaster:
  # How often (minutes) autonomous events roll (meteor drops, blood moons, golden hours)
  event-interval-minutes: 45
  # Enable random autonomous events
  events-enabled: true

# Anarchy & SMP Systems
anarchy:
  # Combat tag duration in seconds (prevents PvP logout cowards)
  combat-tag-seconds: 15
  # Drop victim's decapitated player head on PvP kill
  drop-player-heads: true
  # Enable Diamond bounty system (/bounty) and autonomous AI bounties
  enable-bounties: true
  # Enable killstreak announcements and buffs (3, 5, 10 kills)
  enable-killstreaks: true
  # Enable comedic AI death roasts in chat on hilarious deaths
  enable-ai-death-roasts: true

# Sympathy Care Packages
care-packages:
  # Enable care packages for struggling players (died 3x quickly or in lava)
  enabled: true
  # Cooldown per player in minutes
  cooldown-minutes: 30

# Hypixel-style Watchdog Anti-Cheat
watchdog:
  enabled: true
  # Auto-ban is enabled for definitive KILLAURA_BOT decoy hits, FLY hacks, and blatant X-Ray miners.
  autoban-movement: true
  max-ban-vl: 100

  # Dedicated Fly Autoban (bans players flying in survival mode or hovering/ascending)
  autoban-fly: true
  max-fly-ban-vl: 8
  # Whether survival players are permitted to use /fly without being banned
  allow-survival-flight: false

  # Auto-ban players flagged for blatant X-Ray (reaching max-xray-ban-vl)
  autoban-xray: true
  max-xray-ban-vl: 15
  # When cheaters are banned, only alert online staff and OPs (never spam regular players)
  broadcast-bans: false
  alerts-only-for-staff: true
  # Discord invite link displayed on ban screens and kick screens for appeals
  discord-appeal-url: "http://dsc.gg/dtempire-server"
  # Check thresholds (tuned to prevent false positives during cave jumping/ceiling running)
  checks:
    reach-max-blocks: 4.35
    angle-max-degrees: 115.0
    autoclicker-max-cps: 20
    fly-hover-ticks: 80
    speed-max-blocks-per-tick: 1.15
    # Heuristic Anti-Xray (tracks rare ore velocity and ore-to-stone mining ratio)
    xray-alerts: true

  # Discord Ban Logging
  discord:
    # Direct local Discord Bot bridge (Posts unified card with [Submit Ban Appeal] button)
    bot-api-url: "http://127.0.0.1:25608/ban"
    # Webhook URL fallback if bot bridge is not active
    bans-webhook-url: ""

# GitHub Auto-Updater (checks releases and downloads into plugins/update/)
updater:
  enabled: true
  repo-owner: "hyperdargo"
  repo-name: "DTEmpireAiPlugin"
  # Automatically download new .jar releases to plugins/update/
  auto-download: true
  # How often (hours) to check GitHub releases
  check-interval-hours: 6

# Public Chat AI Observer (Hermes listens to public chat and intervenes if needed)
public-chat-ai:
  # Enable autonomous public chat assistance
  enabled: true
  # Minimum cooldown in seconds between public AI responses
  cooldown-seconds: 12

# DTEmpire Server Lore, Rules & Knowledge Base (injected into AI context)
server-info:
  name: "DTEmpire"
  ip: "play.dtempire.com"
  gamemode: "Survival SMP"
  rules:
    - "No hacking, reach, autoclickers, or cheat clients (Watchdog is actively monitoring)"
    - "No griefing or stealing from other players' builds"
    - "Be respectful to all players and staff members"
    - "No advertising or spamming chat"

# Discord server tracking
tracking:
  # Master switch
  enabled: false
  # Post interval in minutes (1 = every minute for instant-like updates)
  interval-minutes: 1
  discord:
    # Webhook URL (recommended) — OR bot-token + channel-id
    webhook-url: ""
    bot-token: ""
    channel-id: ""
  server:
    # Server display name (shown in embed title)
    name: "DTEmpire"
    # MOTD / description shown in embed
    motd: "Welcome to DTEmpire!"
    # Game mode: survival, creative, adventure, hardcore, etc.
    gamemode: "survival"
    # Server IP shown in embed (manual)
    ip: ""
  embed:
    show-online: true
    show-ram: true
    show-cpu: true
    show-storage: true
    show-ai-sessions: true
    show-top-online: true
    show-recent-joins: true
    show-recent-leaves: true
    show-gamemode: true
    show-server-version: true
    show-ip: true
  thresholds:
    ram-warning-percent: 80
    cpu-warning-percent: 80
    storage-warning-percent: 90
  resources:
    # Manual server allocation (MB). 0 = auto-detect from JVM maxMemory
    ram-max-mb: 0
    # Manual storage allocation (GB). 0 = auto-detect from disk
    storage-max-gb: 0

# Join/leave tracking & Welcome Experience
welcome:
  enabled: true
  # Delay before welcome sequence executes (ticks, 20 = 1 second)
  delay-ticks: 40
  # Returning player message ({player} placeholder)
  message: "&8[&bDTEmpire&8] &rWelcome back, &f{player}&r! Type &e/aidaily&r for today's quest."
  # First-time player join broadcast
  first-join-broadcast: "&6[Welcome] &fLet's give a warm welcome to &e{player} &ffor joining &bDTEmpire&f for the first time! 🎉"
  first-join-title: "&6&lWELCOME TO DTEMPIRE"
  first-join-subtitle: "&fYour adventure begins! Type &e/aihelp"
  first-join-firework: true
  starter-kit:
    enabled: true